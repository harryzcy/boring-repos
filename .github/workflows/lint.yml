name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@26ae60422fa8fafebd2b1a2bccca5207015ac652 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@26ae60422fa8fafebd2b1a2bccca5207015ac652 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@26ae60422fa8fafebd2b1a2bccca5207015ac652 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@26ae60422fa8fafebd2b1a2bccca5207015ac652 # main

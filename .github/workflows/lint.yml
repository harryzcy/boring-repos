name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@5eaf925875721488eed093142fde35b53b8e6865 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@5eaf925875721488eed093142fde35b53b8e6865 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@5eaf925875721488eed093142fde35b53b8e6865 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@5eaf925875721488eed093142fde35b53b8e6865 # main

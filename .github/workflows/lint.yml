name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@8b5eecdfeccfc9598d7d5ffd0139afbf302b68e6 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@8b5eecdfeccfc9598d7d5ffd0139afbf302b68e6 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@8b5eecdfeccfc9598d7d5ffd0139afbf302b68e6 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@8b5eecdfeccfc9598d7d5ffd0139afbf302b68e6 # main

name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@2d3c3315851099b16dcf3d6488dc56c164b0760e # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@2d3c3315851099b16dcf3d6488dc56c164b0760e # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@2d3c3315851099b16dcf3d6488dc56c164b0760e # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@2d3c3315851099b16dcf3d6488dc56c164b0760e # main

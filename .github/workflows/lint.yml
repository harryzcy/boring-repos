name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@f9b86aec2800aded7063cd8c7249a01c1ca71537 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@f9b86aec2800aded7063cd8c7249a01c1ca71537 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@f9b86aec2800aded7063cd8c7249a01c1ca71537 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@f9b86aec2800aded7063cd8c7249a01c1ca71537 # main

name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main

name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@36677a66188f3c7ff6d186727ba1413c53424e4e # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@36677a66188f3c7ff6d186727ba1413c53424e4e # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@36677a66188f3c7ff6d186727ba1413c53424e4e # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@36677a66188f3c7ff6d186727ba1413c53424e4e # main

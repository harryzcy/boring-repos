name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main

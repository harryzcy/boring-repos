name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@900e43605b314650bddc8870cc91ad7f86324860 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@900e43605b314650bddc8870cc91ad7f86324860 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@900e43605b314650bddc8870cc91ad7f86324860 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@900e43605b314650bddc8870cc91ad7f86324860 # main

name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@79a4cd8c212b2b3b4600387355eda5af20a47b80 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@79a4cd8c212b2b3b4600387355eda5af20a47b80 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@79a4cd8c212b2b3b4600387355eda5af20a47b80 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@79a4cd8c212b2b3b4600387355eda5af20a47b80 # main

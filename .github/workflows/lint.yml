name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main

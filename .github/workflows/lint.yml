name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main

name: Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main
  
  npm-lint:
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  prettier:
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main
